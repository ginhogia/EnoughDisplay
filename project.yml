name: EnoughDisplay
options:
  bundleIdPrefix: com.tengjau
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "4"
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
targets:
  EnoughDisplay:
    type: application
    platform: macOS
    sources: [EnoughDisplay]
    info:
      path: EnoughDisplay/Info.plist
      properties:
        CFBundleDisplayName: EnoughDisplay
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tengjau.EnoughDisplay
        # No App Sandbox: Disconnect and DDC need private and IOKit APIs (see docs/adr/0001).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
